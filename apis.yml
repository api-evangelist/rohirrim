aid: rohirrim
name: Rohirrim
description: 'Rohirrim is an AI-native Unified Acquisition Platform that automates and
  accelerates government procurement for both agencies and contractors. Its UnifiedAcquire
  product helps government agencies manage procurements from market research through
  award by automating acquisition documents and centralizing institutional knowledge,
  while UnifiedRespond (RohanRFP) helps companies identify, match, and draft RFP responses
  faster and at lower cost. The company targets federal agencies, government contractors,
  Fortune 500 firms, and healthcare organizations, and is backed by Bessemer Venture
  Partners and Insight Partners. Rohirrim publishes no public developer API surface
  today; this profile captures its public web, content, and security-posture footprint.'
